<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BlogCode - Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<main class="tarjeta">
    <h1>Iniciar sesión</h1>
    <p>Estás en la vista de inicio de sesión.</p>

    <p class="mensaje error" th:if="${param.error}">Usuario o contraseña incorrectos.</p>
    <p class="mensaje info" th:if="${param.logout}">Cerraste sesión correctamente.</p>
    <p class="mensaje error" th:if="${param.sinRol}">Tu usuario no tiene un rol asignado.</p>

    <form th:action="@{/login}" method="post">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="boton">Ingresar</button>
    </form>
</main>
</body>
</html>
