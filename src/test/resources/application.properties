spring.application.name=BlogCode

spring.datasource.url=jdbc:h2:mem:blogtest;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Test-only dummy values, never use outside tests
security.jwt.private.key=test-only-dummy-hmac-key-0123456789abcdef
security.jwt.user.generator=TEST-ISSUER
